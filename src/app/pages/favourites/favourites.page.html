<ion-header>
  <ion-toolbar>
    <ion-title>Favourites</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card *ngFor="let movie of favourites">

    <img [src]="getImage(movie.poster_path)" />

    <ion-card-header>
      <ion-card-title>
        {{ movie.title }}
      </ion-card-title>
    </ion-card-header>

    <ion-button
      [routerLink]="['/movie-details', movie.id]">
      Details
    </ion-button>

  </ion-card>

</ion-content>
